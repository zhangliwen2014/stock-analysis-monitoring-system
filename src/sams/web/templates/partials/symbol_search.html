{% if rows %}
<table>
  <tr><th>市场</th><th>代码</th><th>名称</th><th class="num">最近收盘</th><th></th></tr>
  {% for row in rows %}
  <tr>
    <td>{{ row.market }}</td>
    <td><a href="/symbol/{{ row.market }}/{{ row.code }}{% if back_url %}?back={{ back_url|urlencode }}{% endif %}">{{ row.code }}</a></td>
    <td>{% if row.name %}<a href="/symbol/{{ row.market }}/{{ row.code }}{% if back_url %}?back={{ back_url|urlencode }}{% endif %}">{{ row.name }}</a>{% else %}—{% endif %}</td>
    <td class="num">{{ price(row.price, row.unit) }}</td>
    <td>
      <form method="post" action="/watchlist/add" class="inline-form">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="market" value="{{ row.market }}">
        <input type="hidden" name="code" value="{{ row.code }}">
        <button type="submit">加入</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% elif none_found %}
<p class="muted">查无「{{ query }}」——代码、拼音首字母、名称都没命中。也可以直接提交试试。</p>
{% endif %}
