# SAMS 配置模板：复制为 config/settings.toml 后修改。
# 秘密（secret_key）不要写在这里，用环境变量 SAMS_SECRET_KEY 提供。
#
# ⚠ 这一个 key 是**通知通道凭据的 Fernet 密钥材料**（spec §4.2、`storage/crypto.py`），
# 不只是「登录用的一句话」。换掉它，库里已有的每一行 `channels.config_encrypted` 都解不开，
# 而那条通道在屏幕上照样显示为「启用」——症状是「配过却从来没收过告警」，
# 报错只在你真去发一条时才出现（`Cipher.decrypt` 那句「换过 secret_key 就要重新 add」）。
# 真要换：先 `sams channel list --user …` 记下每一条，逐条重新 `add`，别指望旧密文读得回来。

[storage]
db_path = "data/sams.duckdb"

[general]
report_currency = "CNY"      # 汇总页折算目标币种
rate_limit_per_s = 5         # 单源请求上限（spec §6.1）
polling_interval_s = 10      # 盘中轮询间隔
cooldown_min = 30            # 同一规则命中后的冷却
scheduler_tick_s = 60        # 调度器检查到期任务的间隔（秒）；不是盘中轮询

# sources 是降级顺序：前一个失败才用后一个。
# 这里的值只在**库里 data_sources 表为空**时生效（没跑过 0007 迁移的老库）。
# 跑过迁移之后，真正的链存在库里，由 `sams source add/enable/disable/move` 或管理后台维护，
# 改这里不会有任何效果——两处都能配是新的错账来源，所以库里有权，配置只做兜底。
# post_close_min 是盘后任务的延迟分钟数，美股给大些让任务落到工作日上午。
[markets.A]
tz = "Asia/Shanghai"
currency = "CNY"
post_close_min = 30
sources = ["akshare", "eastmoney", "tencent", "sina"]

[markets.HK]
tz = "Asia/Hong_Kong"
currency = "HKD"
post_close_min = 30
# akshare_hk 只报公司行为，取日线时会被跳过（D38）。写在这里是为了「配置兜底」与
# 库里的种子给同一条链——库里一旦有路由记录，这一行就不再用到了
sources = ["yfinance", "tencent", "akshare_hk"]

[markets.US]
tz = "America/New_York"
currency = "USD"
post_close_min = 60
sources = ["yfinance", "tencent"]
# 盘前/盘后默认不参与轮询，规则需要时才显式启用（spec §6.1）
[markets.US.extended.pre]
open = "04:00"
close = "09:30"

[markets.US.extended.post]
open = "16:00"
close = "20:00"

# 服务（M4-A）：`sams serve` 读这一段。默认只绑回环——单用户产品先服务本机一个人。
# 要给局域网用：host 改成 0.0.0.0 并把 allow_lan 打开（两处必须同时改，单独改 host 起不来）。
[server]
host = "127.0.0.1"
port = 8765
allow_lan = false
session_ttl_days = 7        # 登录会话有效期（天）
idle_timeout_min = 720      # 无操作超时（分钟）：超时后要重新登录
login_max_failures = 5      # 登录失败锁定：窗口内最多失败次数
login_window_min = 5        # 失败锁定的统计窗口（分钟）
display_tz = "Asia/Shanghai"  # 页面上「某一天」按这个时区切（收件箱日期筛选）
public_base_url = ""          # 推送深链根地址；空 = 不附链接。LAN 部署填 http://192.168.x.x:8765
# 要上 HTTPS 就成对给出证书与私钥（会话 cookie 的 Secure 属性随之自动打开）：
# tls_certfile = "/path/cert.pem"
# tls_keyfile = "/path/key.pem"

# 批注与附件（M4-B）。所有上限都是拒绝线：超了报错，不悄悄截断。
[annotations]
attachments_dir = ""        # 空 = <db 所在目录>/attachments；备份时这个目录要一起复制
max_attachments = 5         # 每条批注最多几张截图
max_attachment_mb = 5       # 单张上限（MB）
max_user_total_mb = 512     # 每个用户的附件总配额（MB）
max_body_chars = 20000      # 批注正文上限（字符）
break_glass_minutes = 15    # admin 单条私有批注的临时查看时长
break_glass_max_per_hour = 5  # 每管理员每小时最多授权次数（治理参数，不是性能参数）

# 大盘条指数清单：写了的市场整组覆盖默认，不写用内置九只
# [indices.A]
# codes = ["sh000001"]
# [indices.labels]
# sh000001 = "上证指数"
